<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" /><title>Fra — Perfume Atlas</title><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="interaction-fixes.css" /><link rel="stylesheet" href="mobile.css" /><link rel="stylesheet" href="refinements.css" /></head>
  <body>
    <main class="atlas" id="atlas">
      <div class="floating-bottles" id="floatingBottles" aria-hidden="true"></div>
      <section class="search-area" id="searchArea"><label class="search-bar"><input id="search" autocomplete="off" placeholder="Search Perfumes" /><button id="clearSearch" aria-label="Clear search">×</button></label><div class="search-results" id="searchResults" hidden></div></section>
      <section class="detail-workspace" id="workspace" hidden>
        <button class="back-to-previous" id="backToPrevious" type="button" hidden aria-label="Back to previous perfume">← <span>Back to Previous</span></button>
        <aside class="collections panel" id="collectionsPanel"><button class="bar toggle" id="collectionsToggle"><span id="collectionName">Collections</span><b>+</b></button><div class="collection-grid" id="collectionGrid" hidden></div><button class="bar toggle" id="brandToggle"><span id="brandName">Brand</span><b>+</b></button><div class="collection-grid" id="brandGrid" hidden></div></aside>
        <article class="hero-card panel" id="heroCard"></article><aside class="details-panel" id="detailsPanel"></aside><aside class="connections" id="connections" hidden></aside>
      </section>
    </main>
    <dialog id="mobileNoteDialog" aria-label="Related fragrances"><div id="mobileNoteContent"></div></dialog>
    <script src="perfumes-data.js"></script><script src="bitmap-points.js"></script><script src="note-particles.js"></script><script src="app.js"></script>
    <script src="color-atmosphere.js"></script>
  </body>
</html>
